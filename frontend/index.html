<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>העלאת תמונה</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f5f5f5;
      text-align: center;
      padding-top: 50px;
    }
    #upload-form {
      margin-bottom: 20px;
    }
    #status {
      color: #333;
      font-size: 1.2em;
      margin-top: 10px;
    }
    .error {
      color: red;
    }
    #download-btn {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>שליחת תמונה</h1>
  <form id="upload-form" enctype="multipart/form-data">
    <input type="file" id="file" name="file" required>
    <button type="submit">שלח תמונה</button>
  </form>
  <p id="status"></p>

  <a id="download-btn" href="/download-font" download>
    <button>⬇ הורד את הפונט</button>
  </a>

  <script>
    document.getElementById('upload-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const fileInput = document.getElementById('file');
      const status = document.getElementById('status');
      const downloadBtn = document.getElementById('download-btn');

      if (!fileInput.files.length) {
        status.innerText = '⚠ לא נבחר קובץ';
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      fetch('/upload', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          status.innerText = data.message;
          downloadBtn.style.display = 'inline-block';
        } else {
          status.innerText = '⚠ קרתה שגיאה';
        }
      })
      .catch(err => {
        status.innerText = '⚠ שגיאה בשליחה';
        console.error(err);
      });
    });
  </script>
</body>
</html>
